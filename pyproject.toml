[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "asgard-api-auditor"
version = "0.1.0"
description = "Auditor de APIs para repositorios ASGARD"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Luis Font"}]
dependencies = []

[project.scripts]
asgard-api-auditor = "asgard_api_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
