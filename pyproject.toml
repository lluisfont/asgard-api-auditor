[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asgard-api-auditor"
version = "0.7.2"
description = "Auditor de APIs para repositorios ASGARD"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Luis Font"}]
dependencies = []

[project.scripts]
asgard-api-auditor = "asgard_api_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asgard_api_auditor = ["schemas/*.schema.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "I001"]

[tool.coverage.run]
branch = true
source = ["asgard_api_auditor"]
